---
TypeQualifiers:
  Unit_hipManagedKeyword_SingleGpu: *level_default
  Unit_hipManagedKeyword_MultiGpu:
    <<: *level_default
    # SWDEV-396615 mGPUs not considered correctly
    disabled: [amd_windows, amd_wsl]
  # Intentionally enabled on Windows: it is the only coverage of the managed
  # device-slot write on PAL, where every capability-gated test skips.
  Unit_hipManagedKeyword_KernelReadsManagedSymbol: *level_default
  Unit_hipManagedKeyword_hipMemcpy: *level_default
  Unit_hipManagedKeyword_hipMemcpyHtoD: *level_default
  Unit_hipManagedKeyword_hipMemcpyDtoH: *level_default
  Unit_hipManagedKeyword_hipMemcpyDtoD: *level_default
  Unit_hipManagedKeyword_hipMemcpyWithStream: *level_default
  Unit_hipManagedKeyword_hipMemset: *level_default
  Unit_hipManagedKeyword_hipMemcpy_MultipleSymbols: *level_default
  Unit_hipManagedKeyword_hipMemcpy3D: *level_default
  Unit_hipManagedKeyword_hipMemcpy3D_SyncBehavior:
    <<: *level_default
    disabled: [amd_wsl]
  Unit_hipManagedKeyword_hipMemset3D: *level_default
  Unit_hipManagedKeyword_hipLaunchKernel_SyncBehavior:
    <<: *level_default
    disabled: [amd_wsl]
  Unit_hipManagedKeyword_InitIndependentOfNullStream:
    <<: *level_default
    disabled: [amd_wsl]
  Unit_hipManagedKeyword_hipMemcpyBatchAsync: *level_default
  Unit_hipManagedKeyword_hipMemcpyPeer:
    <<: *level_default
    # SWDEV-396615 mGPUs not considered correctly
    disabled: [amd_windows, amd_wsl]
  Unit_hipManagedKeyword_hipMemcpyPeerAsync_SyncBehavior:
    <<: *level_default
    # SWDEV-396615 mGPUs not considered correctly
    disabled: [amd_windows, amd_wsl]
  Unit_hipManagedKeyword_hipMemcpyAsync_CrossCurrentDeviceStream:
    <<: *level_default
    disabled: [amd_wsl]
  Unit_hipManagedKeyword_hipPointerGetAttributes_BeforeKernel: *level_default
  Unit_hipManagedKeyword_hipPointerGetAttributes_AfterKernel: *level_default
